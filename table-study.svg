<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Объёмный эскиз стола</title>
  <desc id="desc">Аксонометрический эскиз прямоугольной столешницы с видимой толщиной, древесной фактурой и двумя широкими опорными плоскостями.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3e2c8" stop-opacity=".24"/><stop offset="1" stop-color="#bc946d" stop-opacity=".46"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5b08b" stop-opacity=".38"/><stop offset="1" stop-color="#6d4f3a" stop-opacity=".55"/></linearGradient>
    <pattern id="grain" width="74" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M-5 5C16 1 27 8 43 5S65 6 80 2M-5 12C17 8 28 15 46 10S65 12 80 8M-5 21C16 16 29 23 45 19S68 20 80 16" stroke="#fff0d8" stroke-width=".8" opacity=".55"/>
      <path d="M3 16c12-2 21 2 31-1m20 8c9-2 15 2 22 0" stroke="#4f392d" stroke-width=".7" opacity=".38"/>
    </pattern>
  </defs>
  <g stroke="#f7eee2" stroke-linecap="square" stroke-linejoin="round">
    <path d="M36 51H444M36 461H444" stroke-width=".75" opacity=".52"/>
    <path d="M64 394H428" stroke-width=".7" stroke-dasharray="3 5" opacity=".5"/>
    <path d="M65 85 390 43M65 81v8m325-50v8" stroke-width=".75" opacity=".62"/>
    <path d="M49 153v220m-7-220h14m-14 220h14" stroke-width=".7" opacity=".57"/>
  </g>

  <!-- Broad slab supports sit behind and below the top. -->
  <path d="M140 214 191 207 199 376 148 385Z" fill="url(#edge)" opacity=".78" stroke="#f4e6d1" stroke-width="1.05"/>
  <path d="M191 207 216 220 225 365 199 376Z" fill="#6b503b" opacity=".56" stroke="#f4e6d1" stroke-width="1.05"/>
  <path d="M315 192 361 186 370 350 324 358Z" fill="url(#edge)" opacity=".76" stroke="#f4e6d1" stroke-width="1.05"/>
  <path d="M361 186 385 197 394 340 370 350Z" fill="#76563d" opacity=".56" stroke="#f4e6d1" stroke-width="1.05"/>
  <path d="M148 385 225 365M324 358 394 340" stroke="#f7eee2" stroke-width=".55" opacity=".45"/>

  <!-- Isometric tabletop: top plane, a deeper fascia, and a short end-grain edge. -->
  <path d="M69 160 346 124 416 165 139 201Z" fill="url(#top)" stroke="#fff4e6" stroke-width="1.4"/>
  <path d="M69 160 346 124 416 165 139 201Z" fill="url(#grain)" opacity=".75"/>
  <path d="M139 201 416 165v22L139 223Z" fill="url(#edge)" stroke="#fff0dc" stroke-width="1.25"/>
  <path d="M69 160 139 201v22L69 182Z" fill="#b68f6d" opacity=".4" stroke="#fff0dc" stroke-width="1.15"/>
  <path d="M76 164 342 130M145 205 412 170" stroke="#fff5e8" stroke-width=".75" opacity=".75"/>
  <path d="M148 212c33-8 58 2 84-6s45-4 67-8m-151 16c41-3 53 5 88-3" stroke="#fff0d6" stroke-width=".65" opacity=".35"/>

  <!-- Sparse leaders are details of the object, not invented measurements. -->
  <g stroke="#fff2df" stroke-width=".75" opacity=".77">
    <path d="M409 180 439 216h22M345 306 395 341h58"/>
    <path d="M75 265H134m-59-5v10m59-10v10"/>
  </g>
  <g fill="#fff4e6" font-family="Arial, sans-serif" letter-spacing="1.05">
    <text x="36" y="32" font-size="12">СТОЛ / ФОРМА И ОПОРА</text>
    <text x="230" y="72" font-size="10" text-anchor="middle">ПРОПОРЦИИ ПО ПРОЕКТУ</text>
    <text x="459" y="230" font-size="9.5" text-anchor="end">КРАЙ СТОЛЕШНИЦЫ</text>
    <text x="452" y="355" font-size="9.5" text-anchor="end">ОПОРНАЯ ПЛОСКОСТЬ</text>
    <text x="36" y="483" font-size="9.5">КОНЦЕПТУАЛЬНЫЙ ЭСКИЗ · БЕЗ МАСШТАБА</text>
  </g>
</svg>
