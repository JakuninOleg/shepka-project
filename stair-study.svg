<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 650" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Лестничный марш — объёмный вид и план</title>
  <desc id="desc">Десять деревянных ступеней поднимаются вдоль стены. Видны верхние плоскости, толщина и текстура дерева, непрерывная опора под маршем и ограждение по открытому краю. Внизу расположен план марша.</desc>
  <defs>
    <linearGradient id="oakTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ecdbc0"/>
      <stop offset=".43" stop-color="#cda77b"/>
      <stop offset="1" stop-color="#a87951"/>
    </linearGradient>
    <linearGradient id="oakFront" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#b38b65"/>
      <stop offset=".5" stop-color="#8e694d"/>
      <stop offset="1" stop-color="#654d3b"/>
    </linearGradient>
    <linearGradient id="oakEnd" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a57c58"/>
      <stop offset="1" stop-color="#5d4838"/>
    </linearGradient>
    <linearGradient id="wallWash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5b39c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#8c765f" stop-opacity=".32"/>
    </linearGradient>
    <pattern id="woodGrain" width="112" height="27" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M-8 5C12 1 24 8 44 5S82 4 120 1M-7 10C17 8 31 12 52 9S94 11 120 7M-8 19C11 15 28 23 50 18S88 18 120 15M-8 24C17 21 32 26 58 23S95 24 120 20" stroke="#5a3926" stroke-width=".65" opacity=".35"/>
      <path d="M5 14c15-4 27 4 42 0m22 9c11-3 20 2 33-1" stroke="#fff2d5" stroke-width=".7" opacity=".44"/>
    </pattern>
    <pattern id="endGrain" width="19" height="18" patternUnits="userSpaceOnUse">
      <path d="M-3 18C1 11 2 4 7-2M2 20C7 12 7 5 12-2M9 20c4-8 5-14 10-20M15 20c4-7 5-12 9-18" stroke="#3d2b22" stroke-width=".75" opacity=".4"/>
    </pattern>
    <pattern id="plaster" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M5 2h11M18 10h8M2 18h12M16 26h9" stroke="#8d7965" stroke-width=".5" opacity=".35"/>
      <circle cx="24" cy="4" r=".6" fill="#8d7965" opacity=".45"/><circle cx="10" cy="13" r=".5" fill="#8d7965" opacity=".4"/><circle cx="22" cy="21" r=".55" fill="#8d7965" opacity=".35"/>
    </pattern>
    <!-- A single step with a readable top, fascia, end grain and cast edge. -->
    <g id="volumeStep" stroke-linejoin="round">
      <path d="M5 23 134 41 169 20 39-1Z" fill="#514537" opacity=".16"/>
      <path d="M0 0 126 18v20L0 20Z" fill="url(#oakFront)" stroke="#67513f" stroke-width="1.05"/>
      <path d="M0 0 126 18v20L0 20Z" fill="url(#woodGrain)" opacity=".48"/>
      <path d="M126 18 160-3v20l-34 21Z" fill="url(#oakEnd)" stroke="#5e4a3b" stroke-width="1.05"/>
      <path d="M126 18 160-3v20l-34 21Z" fill="url(#endGrain)" opacity=".4"/>
      <path d="M0 0 126 18 160-3 34-21Z" fill="url(#oakTop)" stroke="#6f5947" stroke-width="1.1"/>
      <path d="M0 0 126 18 160-3 34-21Z" fill="url(#woodGrain)" opacity=".76"/>
      <path d="M4 2 125 20M5 17 123 35" stroke="#f6e4c5" stroke-width=".7" opacity=".65"/>
    </g>
  </defs>

  <g fill="#695a4d" font-family="Arial, sans-serif" letter-spacing="1.5">
    <text x="25" y="34" font-size="13">ЛЕСТНИЦА / ОБЪЁМ И КОНСТРУКЦИЯ</text>
  </g>
  <g stroke="#ae9e8d" stroke-width=".7" opacity=".7">
    <path d="M25 50H650M25 489H650"/>
  </g>

  <!-- The stair is fixed to a continuous wall face. It is a schematic surface, not a built interior. -->
  <path d="M208 445 586 220V84L208 309Z" fill="url(#wallWash)"/>
  <path d="M208 445 586 220V84L208 309Z" fill="url(#plaster)" opacity=".56"/>
  <path d="M208 445 586 220M208 309 586 84" stroke="#9b8977" stroke-width=".8" opacity=".55"/>
  <path d="M208 445 586 220 601 235 223 460Z" fill="#685545" opacity=".12"/>

  <!-- The diagonal stringer stays below each tread; no support cuts through the walking surface. -->
  <path d="M91 457 512 206 548 224 127 475Z" fill="#675646" opacity=".58" stroke="#605041" stroke-width=".9"/>
  <path d="M91 457 512 206" stroke="#d4bfa2" stroke-width="1" opacity=".78"/>

  <!-- Far steps first, near steps last: the overlapping timber reads as one flight. -->
  <use href="#volumeStep" x="464" y="198"/>
  <use href="#volumeStep" x="422" y="223"/>
  <use href="#volumeStep" x="380" y="248"/>
  <use href="#volumeStep" x="338" y="273"/>
  <use href="#volumeStep" x="296" y="298"/>
  <use href="#volumeStep" x="254" y="323"/>
  <use href="#volumeStep" x="212" y="348"/>
  <use href="#volumeStep" x="170" y="373"/>
  <use href="#volumeStep" x="128" y="398"/>
  <use href="#volumeStep" x="86" y="423"/>

  <!-- The slim metal guard follows only the open edge, as clarified by the plan. -->
  <path d="M103 338 481 113" stroke="#51483f" stroke-width="2.15" stroke-linecap="square"/>
  <path d="M103 342 481 117" stroke="#cbbba4" stroke-width=".65" opacity=".8"/>
  <g stroke="#66594d" stroke-width="1.3">
    <path d="M103 338v85M229 263v85M355 188v85M481 113v85"/>
  </g>
  <g fill="#5a4a3c"><circle cx="103" cy="338" r="2"/><circle cx="229" cy="263" r="2"/><circle cx="355" cy="188" r="2"/><circle cx="481" cy="113" r="2"/></g>

  <!-- Fine drafting marks keep the volumetric illustration tied to the site's architectural language. -->
  <g stroke="#8c7b6a" stroke-width=".8" opacity=".85">
    <path d="M128 322 93 282H27M416 293l45 59h152"/>
    <path d="M566 160h82M566 164h82" stroke-dasharray="2 4"/>
    <path d="M652 163v219m-7-219h14m-14 219h14"/>
  </g>
  <g fill="#6b5d50" font-family="Arial, sans-serif" font-size="10.5" letter-spacing=".85">
    <text x="27" y="271">ОГРАЖДЕНИЕ</text>
    <text x="465" y="367">НЕПРЕРЫВНАЯ ОПОРА</text>
    <text x="638" y="277" transform="rotate(-90 638 277)">ЛЕСТНИЧНЫЙ МАРШ</text>
  </g>

  <g fill="#695a4d" font-family="Arial, sans-serif" letter-spacing="1.3">
    <text x="25" y="516" font-size="13">ПЛАН МАРША</text>
    <text x="650" y="516" font-size="10" text-anchor="end">МАССИВ / МЕТАЛЛ</text>
  </g>
  <g stroke="#796b5e" stroke-width="1.15">
    <path d="M25 542H650M25 628H650"/>
    <path d="M25 542v86m62-86v86m63-86v86m62-86v86m62-86v86m63-86v86m62-86v86m63-86v86m62-86v86m63-86v86m63-86v86"/>
    <path d="M25 533H650" stroke-width="2.2"/>
  </g>
  <g stroke="#ab947d" stroke-width=".85" opacity=".85">
    <path d="M25 555H650M25 615H650"/>
    <path d="M235 586H445m0 0-8-5m8 5-8 5"/>
  </g>
  <g fill="#796a5b" font-family="Arial, sans-serif" font-size="9.5" letter-spacing="1">
    <text x="25" y="645">ОГРАЖДЕНИЕ ПО ОТКРЫТОМУ КРАЮ</text>
    <text x="650" y="645" text-anchor="end">НАПРАВЛЕНИЕ ПОДЪЁМА →</text>
  </g>

</svg>
